<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Registro</title>
</head>
<body>
  <h1>Formulario de Registro</h1>
  <form action="#" method="post">

    <div>
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez" tabindex="1">
    </div>

    <div>
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required placeholder="Ej: correo@ejemplo.com" tabindex="2">
    </div>

    <div>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres" tabindex="3">
    </div>

    <fieldset>
      <legend>Género:</legend>
      <input type="radio" id="genero_masculino" name="genero" value="masculino" tabindex="4">
      <label for="genero_masculino">Masculino</label>

      <input type="radio" id="genero_femenino" name="genero" value="femenino" tabindex="5">
      <label for="genero_femenino">Femenino</label>

      <input type="radio" id="genero_otro" name="genero" value="otro" tabindex="6">
      <label for="genero_otro">Otro</label>
    </fieldset>

    <fieldset>
      <legend>Intereses:</legend>
      <input type="checkbox" id="interes_musica" name="intereses" value="musica" tabindex="7">
      <label for="interes_musica">Música</label>

      <input type="checkbox" id="interes_deporte" name="intereses" value="deporte" tabindex="8">
      <label for="interes_deporte">Deporte</label>

      <input type="checkbox" id="interes_lectura" name="intereses" value="lectura" tabindex="9">
      <label for="interes_lectura">Lectura</label>
    </fieldset>

    <div>
      <label for="comentarios">Comentarios adicionales:</label>
      <textarea id="comentarios" name="comentarios" placeholder="Escriba aquí sus comentarios" tabindex="10"></textarea>
    </div>

    <div>
      <label for="pais">País:</label>
      <select id="pais" name="pais" tabindex="11">
        <option value="argentina">Argentina</option>
        <option value="brasil">Brasil</option>
        <option value="chile">Chile</option>
      </select>
    </div>

    <div>
      <input type="submit" value="Registrarse" tabindex="12">
    </div>

  </form>
</body>
</html>
