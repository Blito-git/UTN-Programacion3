<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Api de los simpsons</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>

    <header>
        <h1>Api de los simpsons</h1>
        <p>Explorá personajes de la serie con sus imágenes y frases</p>
    </header>

    <section id="controls">
        <button id="load-characters-btn">Cargar Personajes</button>
    </section>

    <section id="loading-section">
        <div class="spinner"></div>
        <p>Cargando personajes...</p>
    </section>

    <div id="error-message"></div>

    <section id="characters-section"></section>

    <footer>
        <a href="https://thesimpsonsapi.com/" target="_blank">API: The Simpsons Quote API</a>
    </footer>

    <script type="module" src="dist/main.js"></script>
</body>
</html>
