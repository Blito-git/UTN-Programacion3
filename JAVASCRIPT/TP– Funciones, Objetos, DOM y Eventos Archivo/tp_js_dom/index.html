<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TP JavaScript: Funciones, Objetos, DOM y Eventos</title>
</head>
<body>

    <h1 id="titulo">Título Original</h1>

    <ul id="lista">
        <li>Elemento 1</li>
        <li>Elemento 2</li>
    </ul>

    <input type="text" id="inputTexto" placeholder="Escribe algo y presiona Enter o el botón">
    <button id="botonAgregar">Agregar</button>

    <form id="formulario">
        <input type="text" id="inputFormulario" placeholder="Ingrese un valor">
        <button type="submit">Enviar</button>
    </form>

    <select id="selectOpciones">
        <option value="opcion1">Opción 1</option>
        <option value="opcion2">Opción 2</option>
        <option value="opcion3">Opción 3</option>
    </select>
    <p id="parrafoSeleccion"></p>

    <script src="script.js"></script>
</body>
</html>
